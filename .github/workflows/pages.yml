# Mỗi lần push lên main, đưa thư mục site/ lên GitHub Pages.
name: Deploy notes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # cho phép bấm chạy tay trong tab Actions

# Quyền tối thiểu để deploy Pages (mặc định GITHUB_TOKEN không có quyền này).
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ một lần deploy chạy tại một thời điểm; lần mới huỷ lần cũ chưa xong.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
